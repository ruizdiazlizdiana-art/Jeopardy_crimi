<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <!-- CSS compilado y minificado, la última versión -->
    <!-- Copia dinámica para cargar de internet
  <link rel="stylesheet" type="text/css" href="./bootstrap/dist/css/bootstrap.min.css" />
    -->
    <!-- Copia estática local (por si te quedás sin internet) -->
  <link rel="stylesheet" type="text/css" href="./bootstrap-static/3.3.5/css/bootstrap.min.css" />

  <!-- Tema opcional para darle un poco más de onda -->
    <!-- Copia dinámica
  <link rel="stylesheet" type="text/css" href="./bootstrap/dist/css/bootstrap-theme.min.css" />
    -->
    <!-- Copia estática -->
  <link rel="stylesheet" type="text/css" href="./bootstrap-static/3.3.5/css/bootstrap-theme.min.css" />

  <link rel="stylesheet" type="text/css" href="./css/jeopardy.css" />

  <!-- La última versión de jQuery, infaltable -->
    <!-- Copia dinámica
  <script type="text/javascript" src="http://code.jquery.com/jquery-latest.min.js"></script>
    -->
    <!-- Copia estática -->
  <script type="text/javascript" src="./js/jquery-latest.min.js"></script>

  <!-- El JavaScript de Bootstrap, clave para que anden los modales -->
    <!-- Copia dinámica
  <script type="text/javascript" language="Javascript" src="./bootstrap/dist/js/bootstrap.min.js"></script>
    -->
    <!-- Copia estática -->
  <script type="text/javascript" language="Javascript" src="./bootstrap-static/3.3.5/js/bootstrap.min.js"></script>

  <script type="text/javascript" language="Javascript" src="./js/jeopardy.js"></script>

  <title>Jeopardy Criminalística</title>
</head>

<body>
  <div class="panel panel-default">
    <div class="panel-heading" id="main-board-categories"></div>

    <div class="panel-body" id="main-board"></div>

    <div class="panel-footer">
      <div class="col-md-4" id="player-1-score-div">
        <h4><span id="player-1-name">Equipo Rojo</span>: <span id="player-1-score">$0</span></h4>
      </div>

      <div class="col-md-4" id="player-2-score-div">
        <h4><span id="player-2-name">Equipo Azul</span>: <span id="player-2-score">$0</span></h4>
      </div>

      <div class="col-md-4" id="player-3-score-div">
        <h4><span id="player-3-name">Equipo Verde</span>: <span id="player-3-score">$0</span></h4>
      </div>

      <div class="clearfix"></div>
    </div>

    <div class="panel-footer">
	    <div class="col-md-4">
        	<button type="button" class="btn btn-info" id="score-adjust">Ajustar Puntajes</button>
	    </div>
	    <div class="col-md-4 text-center">
        	<h4 id="control-info">Turno de: <span id="control-player"></span></h4>
	    </div>
	    <div class="col-md-4">
	        <button type="button" class="btn btn-info pull-right" id="next-round">Siguiente Ronda</button>
			<button type="button" class="btn btn-info pull-right" id="end-round">Terminar Ronda</button>
	    </div>
      <div class="clearfix"></div>
    </div>

  </div>

  <div class="modal fade" id="question-modal" role="dialog" aria-labelledby="question-modal" aria-hidden="true" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog" id="question-modal-dialog">
      <div class="modal-content" id="question-modal-content">
        <div class="modal-header">
          <!-- <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button> -->

          <h4 class="modal-title text-center category-text" id="modal-answer-title">Título del modal</h4>
        </div>

        <div class="modal-body" id="question-modal-body">
          <p id="question" class="question-text text-center"></p>

          <div id="question-image" class="text-center"></div>
        </div>

        <div id="answer" class="text-center modal-footer">
          <div id="answer-text" class="text-center"></div>

          <div id="answer-buttons" class="text-center">
            <button type="button" class="btn btn-primary" id="answer-show-button">Mostrar</button> <button type="button" class="btn btn-primary" id="answer-close-button">Cerrar</button>
          </div>
        </div><!-- /.respuesta -->

        <div id="scoring-buttons" class="text-center modal-footer">
          <div class="score-button-group">
            <div class="col-md-4">
              <button type="button" class="btn btn-danger score-button" id="p1-wrong-button">
                <span class="glyphicon glyphicon-remove"></span>J1
              </button> 
              <button type="button" class="btn btn-success score-button" id="p1-right-button">
                <span class="glyphicon glyphicon-ok"></span>J1
              </button>
            </div>
          </div>

          <div class="score-button-group">
            <div class="col-md-4">
              <button type="button" class="btn btn-danger score-button" id="p2-wrong-button">
                <span class="glyphicon glyphicon-remove"></span>J2
              </button>
              <button type="button" class="btn btn-success score-button" id="p2-right-button">
                <span class="glyphicon glyphicon-ok"></span>J2
              </button>
            </div>
          </div>

          <div class="score-button-group">
            <div class="col-md-4">
              <button type="button" class="btn btn-danger score-button" id="p3-wrong-button">
                <span class="glyphicon glyphicon-remove"></span>J3
              </button>
              <button type="button" class="btn btn-success score-button" id="p3-right-button">
                <span class="glyphicon glyphicon-ok"></span>J3
              </button>
            </div>
          </div>
        </div><!-- /.botones-de-puntaje -->

        <div id="question-timer" class="text-center modal-footer">
          <div id="timer-grid" class="text-center">
            <div class="timer-square timer-set-1"></div>
            <div class="timer-square timer-set-2"></div>
            <div class="timer-square timer-set-3"></div>
            <div class="timer-square timer-set-4"></div>
            <div class="timer-square timer-set-5"></div>
            <div class="timer-square timer-set-4"></div>
            <div class="timer-square timer-set-3"></div>
            <div class="timer-square timer-set-2"></div>
            <div class="timer-square timer-set-1"></div>
          </div>
        </div><!-- /.cronometro -->

      </div><!-- /.contenido-del-modal -->
    </div><!-- /.dialogo-del-modal -->
  </div><!-- /.modal -->

  <div class="modal fade" id="score-adjust-modal" role="dialog" aria-labelledby="score-adjust-modal" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title text-center">Ajustar Nombres</h4>
        </div>

        <div id="adjust-name-input-div" class="modal-body text-center">
          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Nombre J1" id="name-player-1-input" />
          </div>

          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Nombre J2" id="name-player-2-input" />
          </div>

          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Nombre J3" id="name-player-3-input" />
          </div>

          <div class="clearfix"></div>
        </div>

        <div class="modal-header">
          <h4 class="modal-title text-center">Ajustar Puntajes</h4>
        </div>

        <div id="adjust-score-input-div" class="modal-body text-center">
          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Puntaje J1" id="score-player-1-input" />
          </div>

          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Puntaje J2" id="score-player-2-input" />
          </div>

          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Puntaje J3" id="score-player-3-input" />
          </div>

          <div class="clearfix"></div>
        </div>


        <div class="modal-header">
          <h4 class="modal-title text-center">Ajustar Turno</h4>
        </div>
        <div id="adjust-control-input-div" class="modal-body text-center">
          <div class="control-button-group col-md-4">
            <label class="radio-inline"><input type="radio" placeholder="Turno J1" id="control-player-1-input" 
            name="control-input" value="1"/></label>
          </div>

          <div class="control-button-group col-md-4">
            <label class="radio-inline"><input type="radio" placeholder="Turno J2" id="control-player-2-input" 
            name="control-input" value="2"/></label>
          </div>

          <div class="control-button-group col-md-4">
            <label class="radio-inline"><input type="radio" placeholder="Turno J3" id="control-player-3-input" 
            name="control-input" value="3"/></label>
          </div>

          <div class="clearfix"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-dismiss="modal" id="score-adjust-save">
            Guardar y Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="game-load-modal" role="dialog" aria-labelledby="game-load-modal" aria-hidden="true" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog" id="game-load-modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title text-center">Por favor, seleccioná el archivo JSON para cargar</h4>
        </div>
        <div class="modal-body text-center" id="game-load-logo-div">
          <img src="./images/jeopardy_logo.jpg" id="game-load-logo-img">
        </div>
        <div class="modal-body text-center" id="game-load-input-div">
          <input type="file" id="input-file">
          <button type="button" class="btn btn-primary" id="game-load-input-button">Cargar Juego</button>
          <button type="button" class="btn btn-danger" id="kill-music-button">Cortar Música</button>
          <button type="button" class="btn btn-success" id="play-music-button">Poner Música</button>
        </div>
        <div class="modal-footer">
          <p class="bg-danger" id="game-load-error" aria-hidden="true"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="final-jeopardy-modal" role="dialog" aria-labelledby="final-jeopardy-modal" aria-hidden="true" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header text-center">
	      <button type="button" class="btn btn-primary" id="final-answer-show-button">Mostrar</button>
          <h4 class="modal-title text-center" id="final-jeopardy-modal-answer">Título del modal</h4>
        </div>

        <div id="final-jeopardy-score-input-div" class="modal-body text-center">
          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Apuesta J1" id="wager-player-1-input" />
          </div>

          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Apuesta J2" id="wager-player-2-input" />
          </div>

          <div class="score-button-group col-md-4">
            <input type="text" class="form-control" placeholder="Apuesta J3" id="wager-player-3-input" />
          </div>

          <div class="clearfix"></div>
        </div>

        <div id="final-scoring-buttons" class="text-center modal-footer">
          <div class="score-button-group">
            <div class="col-md-4">
              <button type="button" class="btn btn-danger final-score-button" id="final-p1-wrong-button">
                <span class="glyphicon glyphicon-remove"></span>J1
              </button> 
              <button type="button" class="btn btn-success final-score-button" id="final-p1-right-button">
                <span class="glyphicon glyphicon-ok"></span>J1
              </button>
            </div>
          </div>

          <div class="score-button-group">
            <div class="col-md-4">
              <button type="button" class="btn btn-danger final-score-button" id="final-p2-wrong-button">
                <span class="glyphicon glyphicon-remove"></span>J2
              </button>
              <button type="button" class="btn btn-success final-score-button" id="final-p2-right-button">
                <span class="glyphicon glyphicon-ok"></span>J2
              </button>
            </div>
          </div>

          <div class="score-button-group">
            <div class="col-md-4">
              <button type="button" class="btn btn-danger final-score-button" id="final-p3-wrong-button">
                <span class="glyphicon glyphicon-remove"></span>J3
              </button>
              <button type="button" class="btn btn-success final-score-button" id="final-p3-right-button">
                <span class="glyphicon glyphicon-ok"></span>J3
              </button>
            </div>
          </div>
        </div><!-- /.botones-de-puntaje -->

        <div class="modal-footer text-center">
          <button type="button" class="btn btn-primary" data-dismiss="modal" id="final-score-close">
            Cerrar
          </button>
        </div>

      </div>
    </div>
  </div>

  <div class="modal fade" id="daily-double-modal" role="dialog" aria-labelledby="daily-double-modal" aria-hidden="true" data-backdrop="static" data-keyboard="false">

    <div class="modal-dialog" id="daily-double-modal-dialog">
      <div class="modal-content" id="daily-double-modal-content">
        <div class="modal-header">
          <h4 class="modal-title text-center" id="daily-double-modal-title">Título del modal</h4>
        </div>

        <div class="modal-body text-center">
	        <img src="./images/daily_double.jpg" id="daily-double-logo-img">
        </div>

        <div id="daily-double-score-input-div" class="modal-body text-center col-md-4 col-md-offset-4">
          <input type="text" class="form-control" placeholder="Apuesta Daily Double" id="daily-double-wager-input" />
          <div class="clearfix"></div>
        </div>
        <div class="clearfix"></div>

        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="daily-double-wager">
            Hacer Apuesta
          </button>
        </div>


      </div>
    </div>


  </div>

</body>
</html>
